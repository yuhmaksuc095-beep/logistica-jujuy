<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logística de Sucursales Jujuy</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      color: #212529;
    }
    .navbar {
      background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
    }
    .table-container {
      border-radius: 12px;
      overflow: hidden;
    }
    .table th {
      background-color: #f1f3f5;
      color: #495057;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    .badge-status {
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 30px;
    }
    /* Alertas de cupos con mejor contraste */
    .status-ok {
      background-color: #d1e7dd;
      color: #0f5132;
      font-weight: 600;
      border-radius: 6px;
    }
    .status-alert {
      background-color: #f8d7da;
      color: #842029;
      font-weight: 600;
      border-radius: 6px;
    }
    .kpi-card {
      border-left: 5px solid #0d6efd;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <span class="fs-4 fw-bold">🏍️ Logística Jujuy</span>
    </a>
    <span id="statusBadge" class="badge bg-white text-dark badge-status fw-medium">⏳ Cargando...</span>
  </div>
</nav>

<div class="container mb-5">
  
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card p-3 kpi-card">
        <div class="text-muted small text-uppercase fw-bold">Motos Totales en Stock</div>
        <div id="kpiTotalStock" class="fs-2 fw-bold text-dark">-</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 kpi-card" style="border-left-color: #dc3545;">
        <div class="text-muted small text-uppercase fw-bold">Total Faltante para Cupos</div>
        <div id="kpiTotalFaltantes" class="fs-2 fw-bold text-danger">-</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 kpi-card" style="border-left-color: #ffc107;">
        <div class="text-muted small text-uppercase fw-bold text-truncate">Camiones Totales Necesarios</div>
        <div id="kpiTotalCamiones" class="fs-2 fw-bold text-warning">-</div>
      </div>
    </div>
  </div>

  <div class="card mb-4 p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 fw-bold m-0 text-secondary">📊 Resumen de Sucursales</h2>
    </div>
    <div class="table-responsive table-container">
      <table id="summaryTable" class="table table-hover align-middle m-0 text-center">
        <thead>
          <tr>
            <th>Sucursal</th>
            <th>Almacén</th>
            <th>Capacidad Max</th>
            <th>Stock Actual</th>
            <th>Faltan para Cupo</th>
            <th>Sobran</th>
            <th>Camiones Nec.</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>
  </div>

  <div class="card p-4">
    <h2 class="h4 fw-bold mb-3 text-secondary">📋 Detalle del Listado de Motos</h2>
    <div class="table-responsive table-container" style="max-height: 500px;">
      <table id="motosTable" class="table table-striped table-hover align-middle m-0 text-center">
        <thead class="sticky-top bg-white" style="z-index: 1;">
          </thead>
        <tbody>
          </tbody>
      </table>
    </div>
  </div>

</div>

<script>
const sucursales = {
  "Honda Jujuy": { almacen:104, capacidad:100 },
  "Brown 902": { almacen:38, capacidad:140 },
  "Brown 2296": { almacen:37, capacidad:230 }
};

window.addEventListener("DOMContentLoaded", () => {
  const badge = document.getElementById("statusBadge");
  
  fetch("datos.xlsx?v=" + Math.random())
    .then(res => {
      if (!res.ok) throw new Error();
      return res.arrayBuffer();
    })
    .then(buffer => {
      const data = new Uint8Array(buffer);
      const workbook = XLSX.read(data, {type:'array'});
      procesarExcel(workbook);
      badge.innerHTML = "✅ Conectado";
      badge.className = "badge bg-success text-white badge-status";
    })
    .catch(() => {
      badge.innerHTML = "❌ Error de conexión";
      badge.className = "badge bg-danger text-white badge-status";
    });
});

function procesarExcel(workbook){
  const resumenBody = document.querySelector("#summaryTable tbody");
  resumenBody.innerHTML = "";
  const motosHead = document.querySelector("#motosTable thead");
  const motosBody = document.querySelector("#motosTable tbody");
  motosHead.innerHTML = "";
  motosBody.innerHTML = "";

  let headersCargados = false;
  
  // Variables para acumular los KPIs globales
  let globalStock = 0;
  let globalFaltantes = 0;
  let globalCamiones = 0;

  Object.keys(sucursales).forEach(nombreSucursal => {
    const hoja = workbook.Sheets[nombreSucursal];
    if(!hoja) return;

    const datos = XLSX.utils.sheet_to_json(hoja, {header:1});
    if(datos.length === 0) return;

    const headers = datos[0];
    const filas = datos.slice(1).filter(row => row.some(cell => cell !== undefined && cell !== ""));

    const stock = filas.length;
    const capacidad = sucursales[nombreSucursal].capacidad;
    const almacen = sucursales[nombreSucursal].almacen;
    const faltan = Math.max(capacidad - stock, 0);
    const sobran = Math.max(stock - capacidad, 0);
    const camiones = faltan > 0 ? Math.ceil(faltan / 8) : 0;

    // Sumar a los contadores globales
    globalStock += stock;
    globalFaltantes += faltan;
    globalCamiones += camiones;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td class="fw-bold text-start ps-3">${nombreSucursal}</td>
      <td><span class="badge bg-secondary">${almacen}</span></td>
      <td>${capacidad}</td>
      <td class="fw-bold text-primary">${stock}</td>
      <td class="${faltan > 0 ? 'status-alert' : 'status-ok'}">${faltan}</td>
      <td class="${sobran > 0 ? 'status-alert' : 'status-ok'}">${sobran}</td>
      <td class="fw-bold">${camiones > 0 ? '🚛 ' + camiones : '0'}</td>
    `;
    resumenBody.appendChild(row);

    if(!headersCargados){
      const headRow = document.createElement("tr");
      headRow.innerHTML = "<th>Sucursal</th>" + headers.map(h => `<th>${h || ""}</th>`).join("");
      motosHead.appendChild(headRow);
      headersCargados = true;
    }

    filas.forEach(fila => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="text-muted small text-start ps-3">${nombreSucursal}</td>` + headers.map((_, index) => `<td>${fila[index] ?? ""}</td>`).join("");
      motosBody.appendChild(tr);
    });
  });

  // Mostrar los resultados en los cuadros de KPI de arriba
  document.getElementById("kpiTotalStock").innerText = globalStock;
  document.getElementById("kpiTotalFaltantes").innerText = globalFaltantes;
  document.getElementById("kpiTotalCamiones").innerText = globalCamiones > 0 ? globalCamiones + " 🚛" : "0";
}
</script>
</body>
</html>
