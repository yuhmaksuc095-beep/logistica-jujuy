<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logística de Sucursales Jujuy - Yuhmak</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    /* Configuración Global del Tema Oscuro */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a; /* Fondo azul oscuro profundo */
      color: #f8fafc; /* Texto claro */
      padding: 20px;
      margin: 0;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .card {
      background: #1e293b; /* Fondo de tarjeta gris/azul oscuro */
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    /* Diseño de Tablas Adaptado al Tema Oscuro */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: #111e38; /* Fondo interno de la tabla */
      color: #f8fafc;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #233554; /* Bordes sutiles oscuros */
      padding: 12px 10px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #1e293b; /* Encabezado un poco más claro */
      color: #38bdf8; /* Texto de encabezados en azul celeste para resaltar */
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    /* Solución de Visibilidad: Resalta la primera columna de sucursales */
    td:first-child {
      font-weight: 600;
      color: #ffffff; /* Texto puramente blanco para que resalte */
      background-color: #1a2436; /* Fondo ligeramente diferente para la columna fija */
    }

    /* Clases de utilidad para estados */
    .green {
      color: #4ade80; /* Verde brillante para modo oscuro */
      font-weight: bold;
    }

    .red {
      color: #f87171; /* Rojo brillante para modo oscuro */
      font-weight: bold;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="file"] {
      color: #f8fafc;
    }
  </style>
</head>

<body>

<h1>Logística de Sucursales Jujuy</h1>

<div class="card">
  <label><strong>Subir Excel actualizado:</strong></label><br><br>
  <input type="file" id="excelFile" class="form-control" accept=".xlsx,.xls">
  <div id="status"></div>
</div>

<div class="card">
  <h2>Resumen de Sucursales</h2>

  <table id="summaryTable">
    <thead>
      <tr>
        <th>Sucursal</th>
        <th>Almacén</th>
        <th>Capacidad</th>
        <th>Motos en Stock</th>
        <th>Faltan para Cupo</th>
        <th>Sobran</th>
        <th>Camiones Necesarios</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="card">
  <h2>Listado de Motos</h2>

  <table id="motosTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<script>

const sucursales = {
  "Honda Jujuy": { almacen:104, capacidad:100 },
  "Brown 902": { almacen:38, capacidad:140 },
  "Brown 2296": { almacen:37, capacidad:230 }
};

document.getElementById("excelFile").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(event){
    const data = new Uint8Array(event.target.result);
    const workbook = XLSX.read(data, {type:'array'});

    procesarExcel(workbook);

    document.getElementById("status").innerHTML =
      "<span class='green'>✅ Archivo actualizado correctamente</span>";
  };
  reader.readAsArrayBuffer(file);
});

function procesarExcel(workbook){
  const resumenBody = document.querySelector("#summaryTable tbody");
  resumenBody.innerHTML = "";

  const motosHead = document.querySelector("#motosTable thead");
  const motosBody = document.querySelector("#motosTable tbody");
  motosHead.innerHTML = "";
  motosBody.innerHTML = "";

  let headersCargados = false;

  Object.keys(sucursales).forEach(nombreSucursal => {
    const hoja = workbook.Sheets[nombreSucursal];
    if(!hoja) return;

    const datos = XLSX.utils.sheet_to_json(hoja, {header:1});
    if(datos.length === 0) return;

    const headers = datos[0];
    const filas = datos.slice(1).filter(row =>
      row.some(cell => cell !== undefined && cell !== "")
    );

    const stock = filas.length;
    const capacidad = sucursales[nombreSucursal].capacidad;
    const almacen = sucursales[nombreSucursal].almacen;
    const faltan = Math.max(capacidad - stock, 0);
    const sobran = Math.max(stock - capacidad, 0);
    const camiones = faltan > 0 ? Math.ceil(faltan / 8) : 0;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${nombreSucursal}</td>
      <td>${almacen}</td>
      <td>${capacidad}</td>
      <td>${stock}</td>
      <td class="${faltan > 0 ? 'red' : 'green'}">${faltan}</td>
      <td class="${sobran > 0 ? 'red' : 'green'}">${sobran}</td>
      <td>🚚 ${camiones}</td>
    `;
    resumenBody.appendChild(row);

    if(!headersCargados){
      const headRow = document.createElement("tr");
      headRow.innerHTML =
        "<th>Sucursal</th>" +
        headers.map(h => `<th>${h || ""}</th>`).join("");
      motosHead.appendChild(headRow);
      headersCargados = true;
    }

    filas.forEach(fila => {
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td>${nombreSucursal}</td>` +
        headers.map((_, index) => `<td>${fila[index] ?? ""}</td>`).join("");
      motosBody.appendChild(tr);
    });
  });
}

</script>

</body>
</html>
